<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ishbozor{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #05060a;
            --surface: #0d0f1a;
            --surface-2: #131627;
            --accent: #7c6cf6;
            --accent-2: #45c4ff;
            --accent-3: #ff6bb3;
            --text: #f3f4fb;
            --text-dim: #9497b3;
            --border: rgba(255,255,255,0.08);
            --success: #4ade80;
            --danger: #f87171;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(5,6,10,0.7);
            backdrop-filter: blur(16px) saturate(160%);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--text);
        }

        .logo-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            box-shadow: 0 0 12px var(--accent-2);
        }

        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.88rem;
            transition: color 0.2s;
        }

        nav a:hover { color: var(--text); }

        .nav-cta {
            background: linear-gradient(135deg, var(--accent), #5b4fd6);
            color: white !important;
            padding: 0.5rem 1.1rem;
            border-radius: 8px;
            font-weight: 600 !important;
        }

        .back-button-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem 0 2rem;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-2);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .back-button:hover { opacity: 0.8; }

        .main-content {
            min-height: calc(100vh - 200px);
        }

        footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            color: var(--text-dim);
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
        }

        footer p {
            margin: 0.4rem 0;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            nav { gap: 1rem; flex-wrap: wrap; }
            nav a { font-size: 0.85rem; }
            .header-content { flex-direction: column; gap: 1rem; }
            header { padding: 1rem; }
            .back-button-container { padding: 0.5rem 1rem 0 1rem; }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-content">
            <a href="/" class="logo"><span class="logo-dot"></span> ISHBOZOR</a>
            <nav>
                <a href="/">Bosh Sahifa</a>
                <a href="/jobs/">Ish Qidirish</a>
                <a href="/ish-berish/" class="nav-cta">Ish Berish</a>
            </nav>
        </div>
    </header>

    <!-- BACK BUTTON -->
    <div class="back-button-container" id="back-container" style="display: none;">
        <a href="javascript:history.back()" class="back-button">← Orqaga</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Ishbozor - Ish Topish Platforma</p>
        <p>📞 Support: +998 90 123 45 67</p>
    </footer>

    <script>
        function updateBackButton() {
            const currentPath = window.location.pathname;
            const backContainer = document.getElementById('back-container');
            if (currentPath === '/' || currentPath === '') {
                backContainer.style.display = 'none';
            } else {
                backContainer.style.display = 'block';
            }
        }
        updateBackButton();
        window.addEventListener('popstate', updateBackButton);
    </script>
</body>
</html>
