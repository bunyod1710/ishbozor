{% extends 'base.html' %}

{% block title %}Ish Qidirish - Ishbozor{% endblock %}

{% block content %}
<style>
    .jobs-container { max-width: 1100px; margin: 0 auto; padding: 3rem 1.5rem; }

    .jobs-header { text-align: center; margin-bottom: 2rem; }
    .jobs-header h2 {
        font-size: 1.9rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.5rem;
        background: linear-gradient(180deg, #ffffff, rgba(255,255,255,0.7));
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .jobs-header p { color: var(--text-dim); font-size: 0.95rem; }

    .filters-section {
        background: var(--surface-2);
        border: 1px solid var(--border);
        padding: 2rem;
        border-radius: 18px;
        margin-bottom: 2rem;
        position: relative;
        overflow: hidden;
    }
    .filters-section::before {
        content:'';
        position:absolute; top:-40%; right:-10%;
        width:280px; height:280px;
        background: radial-gradient(circle, rgba(124,108,246,0.18), transparent 70%);
        pointer-events:none;
    }

    .filters-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 1.6rem;
        margin-bottom: 1.5rem;
        position: relative; z-index: 1;
    }

    .filter-group label { display: block; font-weight: 600; color: var(--text); margin-bottom: 0.55rem; font-size: 0.88rem; }

    .filter-group select,
    .filter-group input[type="text"] {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.88rem;
        background: var(--surface);
        color: var(--text);
    }
    .filter-group select option { color: #111; }
    .filter-group select:focus,
    .filter-group input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(124,108,246,0.15);
    }

    .job-type-checkboxes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.7rem; }
    .job-type-checkboxes label,
    .status-radios label {
        display: flex; align-items: center; gap: 0.4rem;
        font-weight: 500; color: var(--text-dim); cursor: pointer; font-size: 0.85rem;
    }
    .status-radios { display: flex; gap: 1.3rem; flex-wrap: wrap; }

    .filter-buttons { display: flex; gap: 1rem; position: relative; z-index: 1; }

    .filter-btn {
        padding: 0.85rem 1.6rem;
        background: linear-gradient(135deg, var(--accent), #5b4fd6);
        color: white; border: none; border-radius: 10px;
        font-weight: 700; cursor: pointer;
        box-shadow: 0 8px 24px rgba(124,108,246,0.3);
        transition: transform 0.2s;
    }
    .filter-btn:hover { transform: translateY(-2px); }

    .reset-btn {
        padding: 0.85rem 1.6rem;
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-weight: 600; cursor: pointer;
        transition: background 0.2s;
    }
    .reset-btn:hover { background: rgba(255,255,255,0.08); }

    .jobs-grid { display: grid; grid-template-columns: 1fr; gap: 0.9rem; }

    .job-card {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.4rem 1.6rem;
        display: grid;
        grid-template-columns: 52px 1fr auto;
        gap: 1.2rem;
        align-items: center;
        transition: border-color 0.25s, transform 0.25s;
    }
    .job-card:hover { border-color: rgba(124,108,246,0.4); transform: translateY(-2px); }

    .job-icon {
        width: 52px; height: 52px;
        background: linear-gradient(135deg, var(--accent), #5b4fd6);
        border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.35rem;
    }

    .job-info { min-width: 0; }
    .job-title-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.35rem; flex-wrap: wrap; }
    .job-info h3 { font-size: 1.02rem; font-weight: 700; }

    .status-badge {
        font-size: 0.65rem; font-weight: 700;
        padding: 0.22rem 0.6rem; border-radius: 999px;
        text-transform: uppercase; letter-spacing: 0.4px;
        border: 1px solid;
    }
    .status-open { background: rgba(74,222,128,0.1); color: var(--success); border-color: rgba(74,222,128,0.3); }
    .status-closed { background: rgba(248,113,113,0.1); color: var(--danger); border-color: rgba(248,113,113,0.3); }

    .job-info p { font-size: 0.85rem; color: var(--text-dim); margin: 0.18rem 0; }
    .job-loc { color: var(--accent-2) !important; font-weight: 600; }

    .job-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .tag {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text-dim);
        padding: 0.22rem 0.6rem;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 600;
    }

    .job-side { text-align: right; }
    .job-side .label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
    .job-salary { font-size: 1.1rem; font-weight: 800; margin: 0.15rem 0 0.7rem 0; }

    .btn-apply {
        padding: 0.6rem 1.2rem;
        background: rgba(255,255,255,0.06);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 9px;
        font-size: 0.83rem; font-weight: 700; cursor: pointer;
        white-space: nowrap;
        transition: background 0.2s, border-color 0.2s;
    }
    .btn-apply:hover { background: linear-gradient(135deg, var(--accent), #5b4fd6); border-color: transparent; }

    .empty-state, .loading {
        text-align: center; padding: 2.5rem;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 16px;
        color: var(--text-dim);
    }
    .empty-state h3 { color: var(--text); margin-bottom: 0.5rem; }
    .error { background: rgba(248,113,113,0.1); color: var(--danger); border: 1px solid rgba(248,113,113,0.3); padding: 1rem; border-radius: 10px; text-align: center; }

    /* MODAL */
    .modal-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
        z-index: 1000; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
        background: var(--surface-2); border: 1px solid var(--border);
        border-radius: 18px; max-width: 480px; width: 100%; padding: 2rem;
        position: relative; box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
    .modal-close {
        position: absolute; top: 1rem; right: 1rem;
        background: rgba(255,255,255,0.06); border: 1px solid var(--border);
        width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
        font-size: 15px; color: var(--text-dim);
    }
    .modal-close:hover { color: var(--text); }
    .modal-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 1.2rem; padding-right: 2rem; }
    .modal-row { display: flex; justify-content: space-between; padding: 0.7rem 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .modal-row .label { color: var(--text-dim); }
    .modal-row .value { font-weight: 600; text-align: right; }
    .modal-desc {
        margin: 1.1rem 0; color: var(--text-dim); font-size: 0.88rem; line-height: 1.6;
        background: var(--surface); border: 1px solid var(--border); padding: 1rem; border-radius: 10px;
    }
    .modal-call-btn {
        display: block; width: 100%; text-align: center; margin-top: 1.3rem; padding: 0.9rem;
        background: linear-gradient(135deg, var(--accent), #5b4fd6); color: white; border: none;
        border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; text-decoration: none;
        box-shadow: 0 8px 24px rgba(124,108,246,0.35); transition: transform 0.2s;
    }
    .modal-call-btn:hover { transform: translateY(-2px); }

    @media (max-width: 768px) {
        .filters-grid { grid-template-columns: 1fr; }
        .filters-section { padding: 1.5rem; }
        .job-card { grid-template-columns: 44px 1fr; }
        .job-side { grid-column: 1 / -1; text-align: left; display: flex; align-items: center; justify-content: space-between; margin-top: 0.7rem; }
        .filter-buttons { flex-direction: column; }
        .filter-btn, .reset-btn { width: 100%; }
    }
</style>

<div class="jobs-container">
    <div class="jobs-header">
        <h2>Ish Qidirish</h2>
        <p>Sizga mos ishlarni filtr qilib izlang</p>
    </div>

    <div class="filters-section">
        <form id="filter-form">
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="region-filter">Viloyat</label>
                    <select id="region-filter" name="region">
                        <option value="">Barchasi</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="district-filter">Tuman</label>
                    <select id="district-filter" name="district">
                        <option value="">Barchasi</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Ish Turi</label>
                    <div class="job-type-checkboxes">
                        <label><input type="checkbox" name="job_type" value="construction"> 🏗️ Qurilish</label>
                        <label><input type="checkbox" name="job_type" value="cleaning"> 🧹 Tozalash</label>
                        <label><input type="checkbox" name="job_type" value="repair"> 🔧 Ta'mirish</label>
                        <label><input type="checkbox" name="job_type" value="delivery"> 📦 Tashimoq</label>
                    </div>
                </div>

                <div class="filter-group">
                    <label>Status</label>
                    <div class="status-radios">
                        <label><input type="radio" name="status" value="open"> ✅ Ochiq</label>
                        <label><input type="radio" name="status" value="closed"> ❌ Yopiq</label>
                    </div>
                </div>
            </div>

            <div class="filter-buttons">
                <button type="submit" class="filter-btn">Filtirni Qo'llash</button>
                <button type="reset" class="reset-btn">Tozalash</button>
            </div>
        </form>
    </div>

    <div class="jobs-grid" id="jobs-container">
        <div class="loading">⏳ Ishlar yuklanmoqda...</div>
    </div>
</div>

<!-- BATAFSIL MODAL -->
<div class="modal-overlay" id="job-modal" onclick="if(event.target === this) closeModal()">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-title" id="modal-title">-</div>

        <div class="modal-row"><span class="label">📍 Manzil</span><span class="value" id="modal-location">-</span></div>
        <div class="modal-row"><span class="label">🗺️ Hudud</span><span class="value" id="modal-region">-</span></div>
        <div class="modal-row"><span class="label">💰 Maosh</span><span class="value" id="modal-salary">-</span></div>
        <div class="modal-row"><span class="label">👥 Kerakli ishchilar</span><span class="value" id="modal-workers">-</span></div>

        <div class="modal-desc" id="modal-desc">-</div>

        <a href="#" class="modal-call-btn" id="modal-call-btn">📞 Qo'ng'iroq Qilish</a>
    </div>
</div>

<script>
    let allJobs = [];
    let regions = [];

    async function loadRegions() {
        try {
            const response = await fetch('/api/regions/');
            if (!response.ok) throw new Error('API error');
            const data = await response.json();
            regions = data.results || data;

            const regionSelect = document.getElementById('region-filter');
            regions.forEach(region => {
                const option = document.createElement('option');
                option.value = region.id;
                option.textContent = region.name;
                regionSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Error:', error);
        }
    }

    document.getElementById('region-filter').addEventListener('change', async function(e) {
        const regionId = e.target.value;
        const districtSelect = document.getElementById('district-filter');
        districtSelect.innerHTML = '<option value="">Barchasi</option>';

        if (regionId) {
            try {
                const response = await fetch(`/api/districts/by_region/?region_id=${regionId}`);
                if (!response.ok) throw new Error('API error');
                const data = await response.json();
                const districts = data.results || data;

                districts.forEach(district => {
                    const option = document.createElement('option');
                    option.value = district.id;
                    option.textContent = district.name;
                    districtSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }
    });

    async function loadJobs() {
        try {
            const response = await fetch('/api/jobs/');
            if (!response.ok) throw new Error('API error');

            const data = await response.json();
            allJobs = data.results || data;
            displayJobs(allJobs);
        } catch (error) {
            document.getElementById('jobs-container').innerHTML = `<div class="error">❌ Xato: ${error.message}</div>`;
        }
    }

    function displayJobs(jobs) {
        const container = document.getElementById('jobs-container');
        container.innerHTML = '';

        if (!jobs || jobs.length === 0) {
            container.innerHTML = '<div class="empty-state"><h3>Ishlar topilmadi</h3><p>Boshqa filtrlarni sinab ko\'rib chiqing</p></div>';
            return;
        }

        const typeLabels = { construction: '🏗️ Qurilish', cleaning: '🧹 Tozalash', repair: '🔧 Ta\'mirish', delivery: '📦 Tashimoq', other: '📌 Boshqa' };

        jobs.forEach(job => {
            const card = document.createElement('div');
            card.className = 'job-card';
            const statusOpen = job.status === 'open';
            card.innerHTML = `
                <div class="job-icon">💼</div>
                <div class="job-info">
                    <div class="job-title-row">
                        <h3>${job.title}</h3>
                        <span class="status-badge ${statusOpen ? 'status-open' : 'status-closed'}">${statusOpen ? 'Ochiq' : 'Yopiq'}</span>
                    </div>
                    <p class="job-loc">📍 ${job.region_name} - ${job.district_name}</p>
                    <p>${job.description.substring(0, 80)}...</p>
                    <div class="job-tags">
                        <span class="tag">${typeLabels[job.job_type] || job.job_type}</span>
                    </div>
                </div>
                <div class="job-side">
                    <div class="label">Maosh</div>
                    <div class="job-salary">${Number(job.salary).toLocaleString('ru-RU').replace(/,/g, ' ')} so'm</div>
                    <button class="btn-apply" onclick="openModal(${job.id})">Batafsil</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function openModal(jobId) {
        const job = allJobs.find(j => j.id === jobId);
        if (!job) return;

        document.getElementById('modal-title').textContent = job.title;
        document.getElementById('modal-location').textContent = job.location;
        document.getElementById('modal-region').textContent = `${job.region_name} - ${job.district_name}`;
        document.getElementById('modal-salary').textContent = Number(job.salary).toLocaleString('ru-RU').replace(/,/g, ' ') + " so'm";
        document.getElementById('modal-workers').textContent = job.required_workers + ' kishi';
        document.getElementById('modal-desc').textContent = job.description;

        const phone = job.phone_number || '';
        const callBtn = document.getElementById('modal-call-btn');
        if (phone) {
            callBtn.href = `tel:${phone.replace(/\s/g, '')}`;
            callBtn.textContent = `📞 Qo'ng'iroq Qilish: ${phone}`;
            callBtn.style.display = 'block';
        } else {
            callBtn.style.display = 'none';
        }

        document.getElementById('job-modal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('job-modal').classList.remove('active');
    }

    document.getElementById('filter-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const regionId = document.getElementById('region-filter').value;
        const districtId = document.getElementById('district-filter').value;
        const jobType = Array.from(document.querySelectorAll('input[name="job_type"]:checked')).map(el => el.value);
        const status = document.querySelector('input[name="status"]:checked')?.value;

        let filtered = allJobs;

        if (regionId) filtered = filtered.filter(job => job.region == regionId);
        if (districtId) filtered = filtered.filter(job => job.district == districtId);
        if (jobType.length > 0) filtered = filtered.filter(job => jobType.includes(job.job_type));
        if (status) filtered = filtered.filter(job => job.status == status);

        displayJobs(filtered);
    });

    loadRegions();
    loadJobs();
</script>

{% endblock %}
