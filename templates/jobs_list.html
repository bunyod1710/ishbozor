{% extends 'base.html' %}

{% block content %}
<style>
    .jobs-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 2rem;
        margin: 2rem 0;
    }
    .job-card {
        background-color: white;
        border: 3px solid #1a5c3a;
        border-radius: 8px;
        padding: 1.5rem;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.3s, box-shadow 0.3s;
    }
    .job-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 12px rgba(0,0,0,0.2);
    }
    .job-card h3 {
        color: #1a5c3a;
        margin-bottom: 1rem;
        font-size: 1.3rem;
    }
    .job-info {
        margin: 0.8rem 0;
        color: #333;
        font-size: 0.95rem;
    }
    .job-info strong {
        color: #1a5c3a;
    }
    .salary {
        color: #FFD700;
        font-weight: bold;
        font-size: 1.1rem;
        margin: 1rem 0;
    }
    .status {
        display: inline-block;
        padding: 0.3rem 0.8rem;
        border-radius: 20px;
        font-size: 0.85rem;
        margin: 0.5rem 0;
    }
    .status.open {
        background-color: #90EE90;
        color: #1a5c3a;
    }
    .status.closed {
        background-color: #ddd;
        color: #666;
    }
    .apply-btn {
        background-color: #1a5c3a;
        color: #FFD700;
        padding: 0.8rem 1.5rem;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
        margin-top: 1rem;
        transition: background-color 0.3s;
    }
    .apply-btn:hover {
        background-color: #0d3a20;
    }
    .loading {
        text-align: center;
        color: #1a5c3a;
        font-size: 1.2rem;
    }
    .error {
        background-color: #ffcccc;
        color: #cc0000;
        padding: 1rem;
        border-radius: 5px;
        text-align: center;
    }
</style>

<h2 style="text-align: center; color: #1a5c3a; margin: 2rem 0;">
    💼 Mavjud Ishlar
</h2>

<div id="jobs-container" class="jobs-container">
    <div class="loading">Ishlar yuklanmoqda...</div>
</div>

<script>
    // API'dan jobs olish
    async function loadJobs() {
        try {
            const response = await fetch('http://127.0.0.1:8000/api/jobs/');
            const jobs = await response.json();

            const container = document.getElementById('jobs-container');
            container.innerHTML = ''; // Clear loading

            if (jobs.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #1a5c3a;">Hozircha ish e\'lonlari yo\'q</p>';
                return;
            }

            jobs.forEach(job => {
                const card = document.createElement('div');
                card.className = 'job-card';

                const statusClass = job.status === 'open' ? 'open' : 'closed';
                const statusText = job.status === 'open' ? 'Ochiq' : 'Yopiq';

                card.innerHTML = `
                    <h3>💼 ${job.title}</h3>
                    <div class="job-info">
                        <strong>📍 Joylashuvi:</strong> ${job.location}
                    </div>
                    <div class="job-info">
                        <strong>📝 Ta'rifi:</strong> ${job.description.substring(0, 100)}...
                    </div>
                    <div class="job-info">
                        <strong>🏷️ Turi:</strong> ${job.job_type}
                    </div>
                    <div class="salary">💵 ${job.salary} so'm</div>
                    <div class="job-info">
                        <strong>👥 Zarur mardikorlar:</strong> ${job.required_workers}
                    </div>
                    <span class="status ${statusClass}">${statusText}</span>
                    <button class="apply-btn" onclick="applyJob(${job.id})">
                        Ariza berish
                    </button>
                `;

                container.appendChild(card);
            });
        } catch (error) {
            document.getElementById('jobs-container').innerHTML =
                '<div class="error">❌ Ishlar yuklanishida xato: ' + error.message + '</div>';
        }
    }

    function applyJob(jobId) {
        alert('Ariza berish: Job ID ' + jobId + '\n(Hozircha testga ruxsat)');
    }

    // Page load bo'lganda jobs yukla
    loadJobs();
</script>

{% endblock %}
